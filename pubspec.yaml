name: afrilegacy
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State Management
  provider: ^6.1.2

  # Images
  cached_network_image: ^3.4.1

  path: ^1.9.0

  # Audio
  audioplayers: ^6.1.0

  # AR / 3D
  model_viewer_plus: ^1.7.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Icons
  cupertino_icons: ^1.0.8
  google_sign_in:
    ^6.2.1

    # ... tes dépendances existantes ...

  # Pour uploader vers Cloudinary
  http: ^1.2.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logoremovebg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3D2B1A"
  adaptive_icon_foreground: "assets/images/logoremovebg.png"
